<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sight 部署助手</title>
<style>
:root{
  --bg:#f6f8fb; --surface:#fff; --side:#eef2f8; --ink:#1c2536; --ink2:#4a566c; --muted:#7a869a;
  --line:#e2e8f0; --line2:#cfd8e3;
  --accent:#2b6cd9; --accent-d:#2058b8; --accent-bg:#eaf1fd;
  --ok:#1f9d63; --ok-bg:#e8f6ef; --warn:#b97300; --warn-bg:#fff4dc; --bad:#d64545; --bad-bg:#fdeceb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Microsoft YaHei",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
svg{width:1em;height:1em;flex:none;vertical-align:-.125em}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#f3f6fa;border-color:#b9c5d4}
.btn:disabled,.btn.disabled{opacity:.45;cursor:not-allowed;background:#f3f5f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.primary:disabled{background:var(--accent);opacity:.4}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.btn.danger:hover{background:#bf3636;border-color:#bf3636}
.btn.danger:disabled{background:var(--bad);opacity:.4}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(30,50,90,.07)}
.btn.text-danger{color:var(--bad)}
.btn.text-danger:hover{background:var(--bad-bg);border-color:#f2c4c1}
.btn.lg{height:44px;padding:0 24px;font-size:16px;border-radius:10px}
.btn.sm{height:28px;padding:0 10px;font-size:13px}

/* layout */
#app{display:flex;height:100%}
#side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{display:block;font-size:16px;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;color:var(--muted);font-size:12px}
#hostlist{flex:1;overflow:auto;padding:2px 10px 10px}
.host{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 12px;margin-bottom:2px;cursor:pointer}
.host:hover{background:rgba(255,255,255,.65)}
.host.sel{background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(30,50,90,.08)}
.host .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.host .ad{color:var(--muted);font-size:12px;font-family:var(--mono);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:18px;padding:0 7px;border-radius:9px;background:#e4eaf3;color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:#aab4c3;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:#e9a30f}.dot.bad{background:var(--bad)}
.side-add{padding:6px 10px 10px}
.side-add .btn{width:100%;border-style:dashed;background:transparent;color:var(--accent);border-color:#aebfdc}
.side-add .btn:hover{background:#fff}
.side-empty{padding:14px 18px;color:var(--muted);font-size:13px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px 12px;font-size:12px;color:var(--muted)}
.side-foot .row{display:flex;gap:4px;margin-bottom:8px}
.side-foot .row .btn{flex:1;height:30px;font-size:13px}
.side-foot .links{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.side-foot .links a{color:var(--accent);text-decoration:none}
.side-foot .links a:hover{text-decoration:underline}
.logp{display:flex;align-items:center;gap:6px}
.logp span{flex:1}
.logpath{font-family:var(--mono);font-size:11px;word-break:break-all;line-height:1.45;color:var(--muted);padding:0 2px}
#main{flex:1;min-width:0;overflow:auto}
.wrap{max-width:1080px;margin:0 auto;padding:28px 36px 48px}

/* host header */
.hh{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px}
.hh .t{flex:1;min-width:0}
.hh h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:.01em}
.hh .sub{color:var(--ink2);margin-top:2px;font-size:13.5px}
.hh .sub .mono{font-family:var(--mono)}
.hh .osl{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:8px}
.hh .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hh .main-act{flex:none;text-align:right}
.hh .main-act .hint{font-size:12px;color:var(--muted);margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d6ea;border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

/* product cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(30,50,90,.04);overflow:hidden}
.card.off{background:#f9fafc;border-style:dashed;border-color:var(--line2);box-shadow:none}
.card .ch{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
.pico{width:38px;height:38px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.off .pico{background:#e8ecf2;color:#8a96a8}
.card .ch h2{margin:0;font-size:17px;line-height:1.3}
.card .ch .ver{color:var(--muted);font-size:13px}
.card .ch .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.gray{background:#e8ecf2;color:#68768a}
.badge .dot{background:currentColor}
.kvs{display:grid;grid-template-columns:84px 1fr;gap:7px 12px;padding:4px 20px 14px;margin:0;font-size:13.5px}
.kvs dt{color:var(--muted)} .kvs dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kvs .mono{font-family:var(--mono);font-size:12.5px}
.note{margin:0 20px 14px;padding:9px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px}
.note svg{margin-top:4px}
.note.warn{background:var(--warn-bg);color:#80510a}.note.bad{background:var(--bad-bg);color:#a02f2f}.note.info{background:var(--accent-bg);color:#244e96}
.card .ca{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 16px;border-top:1px solid var(--line);background:#fbfcfe}
.card .ca .grow{flex:1}
.offbody{padding:2px 20px 18px;color:var(--muted)}
.offbody .btn{margin-top:12px}
.skeleton .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f6,#f7f9fc,#eef1f6);background-size:200% 100%;animation:sh 1.4s infinite;margin:10px 20px}
@keyframes sh{to{background-position:-200% 0}}
.refreshing{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.errcard{background:#fff;border:1px solid #f1c9c6;border-radius:12px;padding:26px 28px;display:flex;gap:16px}
.errcard .ic{width:40px;height:40px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.errcard h3{margin:0 0 4px;font-size:17px}
.errcard .hint{margin-top:8px;padding:9px 12px;background:var(--accent-bg);border-radius:8px;color:#244e96;font-size:13.5px}
.errcard .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* empty state */
.empty{max-width:760px;margin:0 auto;padding:72px 36px;text-align:center}
.empty h1{font-size:28px;margin:0 0 8px}
.empty p.lead{color:var(--ink2);font-size:15px;margin:0 0 36px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:left;margin-bottom:36px}
.step3{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
.step3 .n{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.step3 b{display:block;margin-bottom:4px;font-size:15px}
.step3 span{color:var(--ink2);font-size:13px;line-height:1.55;display:block}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,32,56,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .12s}
@keyframes fi{from{opacity:0}}
.md{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,25,50,.3);width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .14s}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}}
.md.w600{width:min(620px,100%)} .md.w760{width:min(760px,100%)} .md.w900{width:min(920px,100%)}
.md.tall{height:min(720px,100%)}
.mh{padding:20px 24px 4px;display:flex;align-items:flex-start;gap:12px}
.mh h3{margin:0;font-size:18px;line-height:1.4;flex:1}
.mh .sub{color:var(--ink2);font-size:13px;font-weight:400;margin-top:2px}
.mh .qi{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--accent-bg);color:var(--accent)}
.md.danger .qi{background:var(--bad-bg);color:var(--bad)}
.md.danger{box-shadow:0 20px 60px rgba(15,25,50,.3),inset 0 4px 0 var(--bad)}
.mb{padding:10px 24px 8px;overflow:auto;flex:1;min-height:0}
.mf:empty{display:none}
.mf{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.mf .left{margin-right:auto;color:var(--muted);font-size:13px}
.detail{margin:0 0 12px;padding:0;list-style:none;color:var(--ink2)}
.detail li{position:relative;padding-left:14px;margin-bottom:3px}
.detail li:before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:#aab4c3}
.md.danger .detail li:before{background:#e59a97}
.qerr{background:var(--bad-bg);color:#a02f2f;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:8px}
.qerr svg{margin-top:4px}
.fld{margin-bottom:14px}
.fld label.l{display:block;font-weight:600;margin-bottom:5px}
.fld .help{color:var(--muted);font-size:12.5px;margin-top:4px}
.inp{width:100%;height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;background:#fff}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,108,217,.18)}
.inp.mono{font-family:var(--mono);font-size:13px}
.inp.bad{border-color:var(--bad)}
.pw{position:relative}.pw .inp{padding-right:42px}
.pw button{position:absolute;right:4px;top:4px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-size:16px}
.pw button:hover{background:#eef1f6}
.row2{display:flex;gap:10px}.row2>*{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:0 18px;height:34px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.typed-word{font-family:var(--mono);font-weight:700;background:var(--bad-bg);color:var(--bad);padding:1px 8px;border-radius:5px;margin:0 3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;cursor:pointer;background:#fff}
.opt:hover{border-color:#9fb4d6}
.opt.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent) inset}
.opt input{margin:4px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:none}
.opt .o1{font-weight:600}.opt .o2{color:var(--ink2);font-size:13px;margin-top:1px}
.opt.tight{padding:9px 14px}

/* packages */
.plist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;padding:2px}
.pk{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left;width:100%}
.pk:hover{border-color:#9fb4d6}
.pk.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent) inset}
.pk .fi{width:34px;height:34px;border-radius:8px;background:#eef1f6;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pk.on .fi{background:#fff;color:var(--accent)}
.pk .pm{flex:1;min-width:0}
.pk .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pk .pd{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.pk .ps{color:var(--ink2);font-size:13px;text-align:right;flex:none}
.pk .ps small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11.5px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.tag.gray{background:#e8ecf2;color:#68768a}
.group-t{font-size:12px;color:var(--muted);margin:10px 2px 4px}
.drop{margin-top:10px;border:1.5px dashed #aebfdc;border-radius:12px;padding:14px;text-align:center;color:var(--ink2);background:#fafcff;cursor:pointer;transition:background .12s,border-color .12s}
.drop.over{background:var(--accent-bg);border-color:var(--accent)}
.drop small{display:block;color:var(--muted);margin-top:2px}
.up{height:6px;background:#e3e9f2;border-radius:3px;margin-top:8px;overflow:hidden}
.up i{display:block;height:100%;background:var(--accent);width:0}
.pickrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.pickrow .sel{flex:1;min-width:0;color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow .sel b{color:var(--ink)}
.hostpick{display:flex;flex-direction:column;gap:6px}
.hostpick .opt .o2{font-family:var(--mono);font-size:12px}
.opt.dis{opacity:.5;cursor:not-allowed}

/* file browser */
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.crumb .path{flex:1;font-family:var(--mono);font-size:12.5px;background:#f3f6fa;border-radius:8px;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;word-break:break-all;line-height:1.4}
.shorts{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flist{border:1px solid var(--line);border-radius:10px;height:320px;overflow:auto}
.fe{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;border-bottom:1px solid #f0f3f7;width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left}
.fe:hover{background:#f3f7fd}.fe.on{background:var(--accent-bg)}
.fe .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe .fz{color:var(--muted);font-size:12px}
.fe svg{color:var(--muted);font-size:17px}.fe.dir svg{color:#d1a23a}

/* task panel */
.panel{width:min(900px,100%);height:min(760px,100%)}
.ph{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.ph h3{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .el{font-family:var(--mono);color:var(--ink2);font-size:13px;display:flex;align-items:center;gap:8px}
.pbody{flex:1;overflow:auto;padding:20px 28px 24px;background:#fcfdfe}
.pfoot{border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pfoot .grow{flex:1}
.banner{margin:0;padding:14px 24px;display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line)}
.banner .bi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#fff}
.banner h4{margin:0;font-size:15.5px}
.banner p{margin:2px 0 0;font-size:13.5px}
.banner.ok{background:var(--ok-bg)}.banner.ok .bi{background:var(--ok)}.banner.ok h4{color:#136f43}
.banner.bad{background:var(--bad-bg)}.banner.bad .bi{background:var(--bad)}.banner.bad h4{color:#a02f2f}
.banner.cancel{background:#f1f3f6}.banner.cancel .bi{background:#8a96a8}
.banner .hintl{margin-top:6px;padding:7px 10px;background:rgba(255,255,255,.75);border-radius:6px;color:#244e96}
.banner .small{color:var(--muted);font-size:12px;margin-top:6px;word-break:break-all}
.res{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.res div{display:flex;gap:8px;align-items:center}

/* timeline */
.tl{position:relative}
.st{position:relative;padding:0 0 18px 40px}
.st:before{content:"";position:absolute;left:11px;top:26px;bottom:-2px;width:2px;background:var(--line)}
.st:last-child:before{display:none}
.st .nd{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#e8ecf2;color:#8a96a8}
.st.done .nd{background:var(--ok);color:#fff}.st.warn .nd{background:#e9a30f;color:#fff}
.st.fail .nd{background:var(--bad);color:#fff}.st.run .nd{background:#fff;border:2px solid var(--accent)}
.st.run .nd .spin{width:12px;height:12px;border-width:2px}
.st .tt{font-weight:600;font-size:15px;line-height:24px}
.ln1{display:flex;gap:8px;align-items:flex-start;margin-top:5px;font-size:13.5px}
.ln1 svg{margin-top:5px;font-size:13px}
.ln1.ok svg{color:var(--ok)}.ln1.warn{color:#80510a}.ln1.warn svg{color:#d58b00}.ln1.fail{color:#a02f2f;font-weight:600}.ln1.fail svg{color:var(--bad)}
.ln1.info{color:var(--ink2)}.ln1.info svg{color:#aab4c3}
.ln1 .tx{min-width:0;overflow-wrap:anywhere}
.prog{margin-top:8px;max-width:620px}
.prog .pl{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink2);margin-bottom:4px}
.prog .pl b{color:var(--ink);font-weight:600}
.bar{height:8px;border-radius:4px;background:#e3e9f2;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.bar.ind i{width:35%!important;animation:ind 1.2s infinite ease-in-out}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.prog .pm{color:var(--muted);font-size:12.5px;margin-top:3px}
.liv{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink2);font-size:13.5px}
.kvt{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:620px;overflow:hidden}
.kvt .kt{padding:6px 12px;background:#f3f6fa;font-weight:600;font-size:12.5px;color:var(--ink2)}
.kvt table{width:100%;border-collapse:collapse;font-size:13px}
.kvt td{padding:5px 12px;border-top:1px solid #eef1f6;vertical-align:top}
.kvt td:first-child{color:var(--muted);width:110px;white-space:nowrap}
.kvt tr:first-child td{border-top:0}
details.lg{margin-top:6px}
details.lg summary{cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none}
details.lg summary:hover{color:var(--ink2)}
.logbox{margin-top:6px;max-height:220px;overflow:auto;background:#f1f3f7;border-radius:8px;padding:8px 12px;font:12px/1.55 var(--mono);color:#4a566c;white-space:pre-wrap;word-break:break-all}

/* log viewer */
.lv{flex:1;min-height:0;display:flex;flex-direction:column}
.lbox{flex:1;min-height:0;overflow:auto;background:#0f1a2b;color:#d7e0ee;border-radius:10px;padding:12px 14px;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all}
.lbox .e{color:#ff8f8a}.lbox .w{color:#f2c25c}
.ltool{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:0 6px}
.sw input{display:none}
.sw .tr{width:36px;height:20px;border-radius:10px;background:#c3ccd9;position:relative;transition:background .15s}
.sw .tr:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+.tr{background:var(--ok)}.sw input:checked+.tr:after{left:18px}
.sw input:disabled+.tr{opacity:.45}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2a3d;color:#fff;padding:9px 18px;border-radius:9px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px}
.fatal{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.fatal .box{max-width:460px}
.fatal .ic{width:64px;height:64px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px}
.fatal.bad .ic{background:var(--bad-bg);color:var(--bad)}
.fatal h2{margin:0 0 8px}.fatal p{color:var(--ink2);margin:0}
.hl{background:#fff4dc;padding:0 3px;border-radius:3px}
@media (max-width:900px){#app{flex-direction:column}#side{width:100%;height:auto;max-height:42%}.wrap{padding:20px 18px}.cards{grid-template-columns:1fr}.steps3{grid-template-columns:1fr}.hh{flex-direction:column}.hh .main-act{text-align:left}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

.panel .mh{padding:16px 24px 14px;border-bottom:1px solid var(--line);align-items:center}
.panel .mh h3{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .mh .el{font-family:var(--mono);color:var(--ink2);font-size:13px}
.panel .mb.pbody{padding:22px 28px 12px;background:#fcfdfe}
.md.panel{width:min(900px,100%);height:min(760px,100%)}
.md.tall .mb{display:flex;flex-direction:column}

<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>

<script>
'use strict';
/* ---------- utils ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function fmtSize(n) {
  n = Number(n);
  if (!isFinite(n) || n < 0) return '-';
  if (n < 1024) return Math.round(n) + ' B';
  var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function fmtSpeed(n) { return fmtSize(n) + '/s'; }
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  var hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  var p = function (x) { return x < 10 ? '0' + x : '' + x; };
  return hh ? hh + ':' + p(mm) + ':' + p(ss) : mm + ':' + p(ss);
}
function fmtTime(ts) {
  var d = new Date(ts * 1000), p = function (x) { return x < 10 ? '0' + x : '' + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function toast(msg) {
  var old = $('#toast'); if (old) old.remove();
  var t = h('div', { id: 'toast' }, [msg]); document.body.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.remove(); }, 2600);
}
function copyText(text) {
  function fallback() {
    var ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选择'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, fallback);
  else fallback();
}

/* ---------- icons (inline svg, 16 viewbox) ---------- */
var IC = {
  check: '<path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  bang: '<path d="M8 3v6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="12.2" r="1.2" fill="currentColor"/>',

  server: '<rect x="2" y="2.5" width="12" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="12" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.6" cy="4.75" r=".8" fill="currentColor"/><circle cx="4.6" cy="11.25" r=".8" fill="currentColor"/>',
  box: '<path d="M8 1.8l5.6 3v6.4L8 14.2l-5.6-3V4.8z M2.6 4.9L8 7.8l5.4-2.9 M8 7.8v6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
  file: '<path d="M4 1.8h5l3.2 3.2v9.2H4z M9 1.8V5h3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
  folder: '<path d="M1.8 4.2h4.2l1.4 1.6h6.8v7H1.8z" fill="currentColor" opacity=".9"/>',
  up: '<path d="M8 13V3M3.5 7.2L8 2.8l4.5 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  upload: '<path d="M8 11V2.5M4.5 5.8L8 2.3l3.5 3.5M2.5 11v2.7h11V11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  refresh: '<path d="M13.3 8a5.3 5.3 0 1 1-1.6-3.8M13.4 2.4v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  warn: '<path d="M8 2l6.3 11H1.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".9" fill="currentColor"/>',
  help: '<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.1 6.3a2 2 0 1 1 2.9 1.8c-.7.4-1 .8-1 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="currentColor"/>',
  eye: '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/>',
  copy: '<rect x="5.2" y="5.2" width="8" height="8.3" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.8 3.4V3a1.2 1.2 0 0 0-1.2-1.2H4A1.2 1.2 0 0 0 2.8 3v6.2A1.2 1.2 0 0 0 4 10.4h.4" fill="none" stroke="currentColor" stroke-width="1.3"/>',
  play: '<path d="M5 3l8 5-8 5z" fill="currentColor"/>',
  stop: '<rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/>',
  logo: '<path d="M3 11.5L8 3l5 8.5M5.2 8.6h5.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13.6h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  ext: '<path d="M6.5 3H3v10h10V9.5M9 2.5h4.5V7M13.5 2.5L7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'
};
function ico(n, cls) { return '<svg viewBox="0 0 16 16" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + IC[n] + '</svg>'; }

/* ---------- api ---------- */
var TOKEN = '';
(function () {
  try {
    var q = new URLSearchParams(location.search), t = q.get('t');
    if (t) { sessionStorage.setItem('sd_token', t); history.replaceState(null, '', location.pathname); }
  } catch (e) { }
  try { TOKEN = sessionStorage.getItem('sd_token') || ''; } catch (e) { }
})();
var DEAD = false;
function fatal(icon, title, msg, bad) {
  if (DEAD) return; DEAD = true;
  document.body.appendChild(h('div', { class: 'fatal' + (bad ? ' bad' : ''), html: '<div class="box"><div class="ic">' + ico(icon) + '</div><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p></div>' }));
}
function api(method, path, body) {
  var opt = { method: method, headers: { 'X-Token': TOKEN } };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (r) {
    if (r.status === 403) { fatal('warn', '会话已失效', '请重新打开 Sight 部署助手。', true); throw new Error('403'); }
    return r.text().then(function (txt) {
      var j = null; try { j = txt ? JSON.parse(txt) : {}; } catch (e) { }
      if (!r.ok) { var er = new Error((j && j.error) || ('请求失败（' + r.status + '）')); er.status = r.status; throw er; }
      return j;
    });
  });
}

/* ---------- modal / layers ---------- */
var zTop = 100;
/* opts: title, sub, icon, danger, cls, body(Node), actions[{label,kind,onClick,key,disabled}], left(Node|string),
   dismiss (true = Esc closes, calls onDismiss), onDismiss, enter (action key to trigger with Enter on inputs) */
function openModal(o) {
  var ov = h('div', { class: 'ov' }); ov.style.zIndex = ++zTop;
  var md = h('div', { class: 'md ' + (o.cls || '') + (o.danger ? ' danger' : ''), role: 'dialog', 'aria-modal': 'true' });
  var hd = h('div', { class: 'mh' });
  if (o.icon) hd.appendChild(h('div', { class: 'qi', html: ico(o.icon) }));
  var tt = h('h3', null, [o.title || '']);
  if (o.sub) tt.appendChild(h('div', { class: 'sub' }, [o.sub]));
  hd.appendChild(tt);
  var body = h('div', { class: 'mb' }); if (o.body) body.appendChild(o.body);
  var ft = h('div', { class: 'mf' });
  md.appendChild(hd); md.appendChild(body); md.appendChild(ft); ov.appendChild(md);
  var prevFocus = document.activeElement;
  var M = { el: ov, md: md, body: body, foot: ft, btn: {}, closed: false };
  M.setActions = function (acts, left) {
    ft.innerHTML = ''; M.btn = {};
    if (left) ft.appendChild(h('div', { class: 'left' }, [left]));
    (acts || []).forEach(function (a) {
      var b = h('button', { class: 'btn ' + (a.kind || ''), type: 'button', 'data-job': a.job ? '1' : null }, [a.label]);
      if (a.disabled) b.disabled = true;
      b.addEventListener('click', function () { if (!b.disabled) a.onClick(M); });
      M.btn[a.key || a.label] = b; M.acts = M.acts || {}; ft.appendChild(b);
    });
    M.actions = acts || [];
    if (typeof applyBusy === 'function') applyBusy();
  };
  M.close = function () {
    if (M.closed) return; M.closed = true; ov.remove();
    try { if (prevFocus && prevFocus.focus && document.body.contains(prevFocus)) prevFocus.focus(); } catch (e) { }
  };
  M.setActions(o.actions, o.left);
  M.enterKey = o.enter;
  M.dismiss = o.dismiss;
  ov.addEventListener('keydown', function (ev) {
    if (ov.nextSibling && ov.nextSibling.classList && ov.nextSibling.classList.contains('ov')) return; // not the top layer
    if (ev.key === 'Escape') {
      if (typeof o.dismiss === 'function' ? o.dismiss(M) : o.dismiss) { ev.preventDefault(); if (o.onDismiss) o.onDismiss(M); else M.close(); }
      else ev.preventDefault();
    } else if (ev.key === 'Enter' && M.enterKey && !ev.isComposing && ev.keyCode !== 229) {
      var t = ev.target;
      if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || (t.tagName === 'A'))) return;
      var b = M.btn[M.enterKey];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
    }
  });
  $('#layers').appendChild(ov);
  setTimeout(function () {
    var f = o.focus ? md.querySelector(o.focus) : md.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea');
    if (!f) f = (M.btn[o.focusKey || o.enter] || md.querySelector('input:checked') || md.querySelector('button'));
    if (f && f.focus) f.focus();
  }, 30);
  return M;
}
/* yes/no confirmation; resolves boolean */
function uiConfirm(o) {
  return new Promise(function (res) {
    var body = h('div'); 
    if (o.lines) body.appendChild(h('ul', { class: 'detail' }, o.lines.map(function (l) { return h('li', null, [l]); })));
    openModal({
      title: o.title, icon: o.danger ? 'warn' : 'help', danger: o.danger, body: body, dismiss: true, onDismiss: function (M) { M.close(); res(false); },
      focusKey: o.danger ? 'no' : 'yes', enter: o.danger ? null : 'yes',
      actions: [{ label: o.no || '取消', key: 'no', onClick: function (M) { M.close(); res(false); } },
        { label: o.yes || '确定', key: 'yes', kind: o.danger ? 'danger' : 'primary', onClick: function (M) { M.close(); res(true); } }]
    });
  });
}
function pwField(id, val, ph) {
  var inp = h('input', { class: 'inp', type: 'password', autocomplete: 'off', id: id || null, placeholder: ph || '' }); inp.value = val || '';
  var b = h('button', { type: 'button', title: '显示 / 隐藏', 'aria-label': '显示或隐藏', html: ico('eye') });
  b.addEventListener('click', function () { inp.type = inp.type === 'password' ? 'text' : 'password'; inp.focus(); });
  return { wrap: h('div', { class: 'pw' }, [inp, b]), input: inp };
}
function detailList(lines) {
  if (!lines || !lines.length) return null;
  return h('ul', { class: 'detail' }, lines.map(function (l) { return h('li', null, [l]); }));
}
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); });
/* ---------- local file browser ---------- */
function openBrowser(kind, startDir, onPick) {
  var cur = null, selPath = null;
  var path = h('div', { class: 'path', title: '' }), up = h('button', { class: 'btn', type: 'button', html: ico('up') + '上一级' });
  var shorts = h('div', { class: 'shorts' }), list = h('div', { class: 'flist' });
  var body = h('div', null, [h('div', { class: 'crumb' }, [up, path]), shorts, list]);
  var M = openModal({
    title: kind === 'key' ? '选择私钥文件' : kind === 'jdk' ? '选择 JDK 压缩包' : '选择安装包', sub: '浏览本机文件，双击文件即可选择', cls: 'w600', body: body, dismiss: true, enter: 'ok',
    actions: [{ label: '取消', onClick: function (M) { M.close(); } },
      { label: '选择', key: 'ok', kind: 'primary', disabled: true, onClick: function (M) { M.close(); onPick(selPath); } }]
  });
  function load(dir) {
    list.innerHTML = '<div class="side-empty"><span class="spin"></span> 正在读取…</div>';
    api('GET', '/api/fs?kind=' + encodeURIComponent(kind || 'any') + (dir ? '&dir=' + encodeURIComponent(dir) : '')).then(function (r) {
      cur = r; path.textContent = r.dir || '（选择磁盘）'; path.title = r.dir || '';
      up.disabled = !r.parent; selPath = null; M.btn.ok.disabled = true;
      shorts.innerHTML = '';
      (r.shortcuts || []).forEach(function (s) { shorts.appendChild(h('button', { class: 'btn sm', type: 'button', onclick: function () { load(s.path); } }, [s.name])); });
      list.innerHTML = '';
      if (!r.entries.length) list.appendChild(h('div', { class: 'side-empty' }, ['这个文件夹里没有可选的文件。']));
      r.entries.slice().sort(function (a, b) { return (b.is_dir - a.is_dir) || a.name.toLowerCase().localeCompare(b.name.toLowerCase()); }).forEach(function (en) {
        var row = h('button', { class: 'fe' + (en.is_dir ? ' dir' : ''), type: 'button', html: ico(en.is_dir ? 'folder' : 'file') + '<span class="fn">' + esc(en.name) + '</span>' + (en.is_dir ? '' : '<span class="fz">' + fmtSize(en.size) + (en.mtime ? '　' + fmtTime(en.mtime) : '') + '</span>') });
        row.addEventListener('click', function () {
          if (en.is_dir) { load(en.path); return; }
          Array.prototype.forEach.call(list.children, function (c) { c.classList.remove('on'); });
          row.classList.add('on'); selPath = en; M.btn.ok.disabled = false;
        });
        row.addEventListener('dblclick', function () { if (!en.is_dir) { M.close(); onPick(en); } });
        list.appendChild(row);
      });
    }, function (e) { list.innerHTML = '<div class="side-empty" style="color:var(--bad)">' + esc(e.message) + '</div>'; });
  }
  up.addEventListener('click', function () { if (cur && cur.parent) load(cur.parent); });
  load(startDir);
  return M;
}

/* ---------- file picker (discovered list + browse + drop upload) ---------- */
/* opts: kind 'package'|'jdk'|'key', prefer: product id, onChange(sel) ; returns {el, get()} */
function buildPicker(opts) {
  var kind = opts.kind || 'package', sel = null, items = [], uploading = false;
  var listEl = h('div', { class: 'plist' });
  var selEl = h('div', { class: 'sel' });
  var drop = h('div', { class: 'drop', tabindex: '0', role: 'button' });
  var fileInp = h('input', { type: 'file', class: 'hidden' });
  var noun = kind === 'jdk' ? 'JDK 压缩包' : kind === 'key' ? '私钥文件' : '安装包';
  var browseBtn = h('button', { class: 'btn', type: 'button', html: ico('folder') + '浏览…' });
  var el = h('div', null, [listEl, drop, fileInp, h('div', { class: 'pickrow' }, [selEl, browseBtn])]);
  function resetDrop() {
    drop.innerHTML = '把' + noun + '拖到这里，或点击选择文件<small>文件会先复制到本机程序，再用于部署（走本机回环，速度很快）</small>';
  }
  resetDrop();
  function setSel(s) {
    sel = s;
    Array.prototype.forEach.call(listEl.querySelectorAll('.pk'), function (b) { b.classList.toggle('on', b.getAttribute('data-path') === (s && s.path)); });
    selEl.innerHTML = s ? '已选择：<b>' + esc(s.name) + '</b>' + (s.size ? '（' + fmtSize(s.size) + '）' : '') : '<span style="color:var(--muted)">尚未选择' + noun + '</span>';
    selEl.title = s ? s.path : '';
    if (opts.onChange) opts.onChange(s);
  }
  function pkItem(p) {
    var prod = p.product && S.state && S.state.products[p.product] ? S.state.products[p.product].name : null;
    var b = h('button', { class: 'pk', type: 'button', 'data-path': p.path, html:
      '<div class="fi">' + ico('box') + '</div><div class="pm"><div class="pn">' + esc(p.name) +
      (prod ? '<span class="tag">' + esc(prod) + (p.version ? ' ' + esc(p.version) : '') + '</span>' : '') +
      '</div><div class="pd" title="' + esc(p.dir) + '">' + esc(p.dir) + '</div></div><div class="ps">' + fmtSize(p.size) + '<small>' + fmtTime(p.mtime) + '</small></div>' });
    b.addEventListener('click', function () { setSel(p); });
    return b;
  }
  function renderList() {

  var openLog = st.logOpen;

  if (!st.el) { st.el = h('div'); j.panel.tl.appendChild(st.el); }

}
function panelFlush(j) {
  var p = j.panel; if (!p) return;
  var ph = $('[data-ph]', p.tl); if (ph) ph.remove();
  var dirty = p.dirty; p.dirty = [];
  dirty.forEach(function (st) { renderStep(j, st); });
  if (p.stick) { var b = p.tl.parentNode; b.scrollTop = b.scrollHeight; }
}

function resultSummary(j) {

      var row = h('div', null, [h('span', { class: 'badge ' + cls }, [x.status || '']), h('b', null, [x.host])]);
      if (x.url && x.status === '完成') row.appendChild(h('a', { href: x.url, target: '_blank', rel: 'noopener' }, [x.url]));
      box.appendChild(row);
    });
    wrap.appendChild(box);

}
function bannerText(j) {
  var r = j.result || {};
  switch (j.kind) {
    case 'deploy': return '安装 / 升级已完成';
    case 'rollback': return '回滚已完成';
    case 'service': return '操作已完成';
    case 'add_host': return '服务器已添加：' + (r.name || '');

    case 'test_host': return r.root ? '连接正常，当前账号具有 root 权限' : '连接正常，但当前账号不是 root，部分操作会要求 sudo 密码';
  }

}
function panelDone(j) {
  var p = j.panel; clearInterval(j.tid);
  p.el.textContent = fmtDur((j.tEnd - j.t0) / 1000);
  p.stopBtn.remove();
  j.cancelled = !j.ok && (j.error === '已取消' || /^已取消/.test(j.error || ''));
  j.steps.forEach(function (st) { markDirty(j, st); });
  var ph = $('[data-ph]', p.tl); if (ph) ph.remove();
  if (!j.steps.length) { var s0 = curStep(j); markDirty(j, s0); }
  panelFlush(j);
  var cls = j.ok ? 'ok' : (j.cancelled ? 'cancel' : 'bad'), inner = h('div', { style: 'flex:1;min-width:0' });
  var bn = h('div', { class: 'banner ' + cls, role: 'status' }, [h('div', { class: 'bi', html: ico(j.ok ? 'check' : (j.cancelled ? 'stop' : 'x')) }), inner]);
  if (j.ok) {
    inner.appendChild(h('h4', null, [bannerText(j)]));

    inner.appendChild(h('h4', null, ['任务已取消']));

  } else {
    inner.appendChild(h('h4', null, [(j.o.failTitle || '任务失败')]));
    inner.appendChild(h('p', null, [j.error || '发生了未知错误']));

    if (S.state && S.state.log_path) inner.appendChild(h('div', { class: 'small' }, ['详细日志：' + S.state.log_path]));
  }
  p.M.md.insertBefore(bn, p.M.foot);
  setTimeout(function () { var bb = p.tl.parentNode; bb.scrollTop = bb.scrollHeight; }, 0);
  var bb0 = p.tl.parentNode; bb0.scrollTop = bb0.scrollHeight;
  var acts = [];
  if (j.ok && j.kind === 'deploy' && j.result && j.result.results) {
    var ok = j.result.results.filter(function (x) { return x.url && x.status === '完成'; });
    ok.forEach(function (x) {

      acts.push({ label: lbl, kind: '', onClick: function () { window.open(x.url, '_blank', 'noopener'); } });

}

/* ---------- status ---------- */
function startStatus(name) {
  if (!name) return;
  S.loading = name; delete S.statusErr[name]; renderSide(); renderMain();
  if (isBusy()) {
    if (J && J.kind === 'status' && !J.panel) { S.pendingStatus = name; cancelJob(J); return; }
    S.loading = null; renderMain(); return;
  }
  startJob('status', { host: name }, {
    panel: false, noRefresh: true,
    onFail: function () { S.loading = null; renderMain(); },
    onDone: function (j) {
      var cancelled = !j.ok && /^已取消/.test(j.error || '');
      if (S.loading === name) S.loading = null;
      if (j.ok && j.result) { S.status[name] = j.result; delete S.statusErr[name]; }
      else if (!cancelled) { S.statusErr[name] = { error: j.error, hint: j.hint }; }
      var p = S.pendingStatus; S.pendingStatus = null;
      if (p) { startStatus(p); return; }
      renderSide(); renderMain();
    }
  });
}
function selectHost(name) {
  if (name === S.sel && (S.status[name] || S.loading === name)) return;
  S.sel = name; lsSet('sd_host', name);
  if (S.loading && S.loading !== name && !(J && J.kind === 'status')) S.loading = null;
  startStatus(name);
}

/* install / upgrade: step 1 choose package, step 2 choose servers */
function deployFlow(hostName, productId) {
  var pk = buildPicker({ kind: 'package', prefer: productId || null, autoSelect: !!productId, onChange: function (s) { syncNext(); } });
  var M1;
  function syncNext() { if (M1 && M1.btn.next) M1.btn.next.disabled = !pk.get() || pk.isUploading(); }
  function step1() {
    var body = h('div', null, [pk.el]);
    M1 = openModal({
      title: productId ? '选择 ' + productName(productId) + ' 安装包' : '选择安装包', sub: '第 1 步，共 2 步', cls: 'w760', body: body, dismiss: true, enter: 'next',
      actions: [{ label: '取消', onClick: function (M) { M.close(); } },
        { label: '下一步', key: 'next', kind: 'primary', disabled: !pk.get(), onClick: function (M) { M.close(); step2(); } }]
    });
    $('.mb', M1.md).style.minHeight = '320px';
  }
  function step2() {
    var pkg = pk.get(), picked = {}; picked[hostName] = true;
    var list = h('div', { class: 'hostpick' }), n = S.state.hosts.length;
    S.state.hosts.forEach(function (hs) {
      var cb = h('input', { type: 'checkbox' }); cb.checked = !!picked[hs.name];
      var row = h('label', { class: 'opt tight' + (cb.checked ? ' on' : '') }, [cb, h('div', null, [h('div', { class: 'o1' }, [hs.name]), h('div', { class: 'o2' }, [hs.user + '@' + hs.host])])]);
      cb.addEventListener('change', function () { picked[hs.name] = cb.checked; row.classList.toggle('on', cb.checked); sync(); });
      list.appendChild(row);
    });
    var prod = pkg.product ? productName(pkg.product) : '';
    var body = h('div', null, [
      h('div', { class: 'note info', style: 'margin:0 0 14px', html: ico('box') + '<div>安装包：<b>' + esc(pkg.name) + '</b>' + (prod ? '（' + esc(prod) + (pkg.version ? ' ' + esc(pkg.version) : '') + '）' : '') + '，' + fmtSize(pkg.size) + '</div>' }),
      h('div', { style: 'font-weight:600;margin-bottom:8px' }, ['部署到哪些服务器？']), list,
      n > 1 ? h('div', { class: 'help', style: 'color:var(--muted);font-size:12.5px;margin-top:10px' }, ['选择多台时会依次处理（滚动升级）；某台失败时，程序会询问是否继续处理后面的服务器。']) : null
    ]);
    var M2 = openModal({
      title: '选择要部署的服务器', sub: '第 2 步，共 2 步', cls: 'w600', body: body, dismiss: true, enter: 'go',
      actions: [{ label: '上一步', onClick: function (M) { M.close(); step1(); } }, { label: '取消', onClick: function (M) { M.close(); } },
        { label: '开始安装 / 升级', key: 'go', kind: 'primary', job: true, onClick: function (M) { go(M); } }]
    });
    function sync() {
      var c = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
      M2.btn.go.disabled = !c || isBusy();

      else { var sep = document.createElement('div'); sep.style.cssText = 'color:#6f86a8;margin:4px 0'; sep.textContent = '—— 以下为实时日志 ——'; box.appendChild(sep); box.scrollTop = box.scrollHeight; }

  if (!TOKEN) { fatal('warn', '缺少访问凭证', '请通过 Sight 部署助手打开本页面（不要直接收藏或手输地址）。', true); return; }
  refreshState().then(function () {
    renderAll();
    if (S.state.busy) attachJob(S.state.busy, 'unknown', { title: '正在进行的任务', noRefresh: false });
  }, function (e) { if (!DEAD) fatal('warn', '无法读取状态', e.message, true); });
  beat(); setInterval(beat, 5000);
}
init();
</script>
</body>
</html>
